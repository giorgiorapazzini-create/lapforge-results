const $=id=>document.getElementById(id);function el(tag,value){const x=document.createElement(tag);if(value!==undefined)x.textContent=value;return x}function T(k){return labels[lang][k]||k}
function date(v){const dateOnly=typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v),d=new Date(dateOnly?v+'T12:00:00':v);return Number.isNaN(d.valueOf())?v:dateOnly?d.toLocaleDateString(lang==='it'?'it-IT':'en-GB'):d.toLocaleString(lang==='it'?'it-IT':'en-GB')}
function time(v){if(!Number.isFinite(v)||v<0)return '—';const ms=Math.round(v*1000),m=Math.floor(ms/60000),s=((ms%60000)/1000).toFixed(3);return m?m+':'+s.padStart(6,'0'):s}
function card(title){const c=el('section');c.className='card';if(title)c.append(el('h2',title));return c}
function button(label,fn,style){const b=el('button',label);b.className=style||'item';b.onclick=fn;return b}
function table(headers,rows){const wrap=el('div');wrap.className='table';const t=el('table'),head=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));head.append(tr);t.append(head);const body=el('tbody');for(const row of rows){const line=el('tr');for(const value of row){const td=el('td');if(value instanceof Node)td.append(value);else td.textContent=String(value??'');line.append(td)}body.append(line)}t.append(body);wrap.append(t);return wrap}
function open(next){navStack.push(view);view=next;render();window.scrollTo(0,0)}
function empty(c){c.append(el('p',T('none')))}
function heading(item,title){const c=card(title||item.name);c.append(el('div',T('track')+': '+item.track+' · '+date(item.date)));return c}
function section(title,items,type){const c=card(title),row=el('div'),label=el('label',T('date')),select=el('select');row.className='filter';select.id='date-'+type;label.htmlFor=select.id;const all=el('option',T('allDates'));all.value='';select.append(all);const dates=[...new Set(items.map(item=>String(item.date||'').slice(0,10)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort().reverse();for(const d of dates){const option=el('option',new Date(d+'T12:00:00').toLocaleDateString(lang==='it'?'it-IT':'en-GB'));option.value=d;select.append(option)}select.value=dateFilters[type];select.onchange=()=>{dateFilters[type]=select.value;render()};row.append(label,select);c.append(row);let count=0;items.forEach((item,i)=>{if(dateFilters[type]&&String(item.date||'').slice(0,10)!==dateFilters[type])return;count++;c.append(button(item.name+' · '+item.track+' · '+date(item.date),()=>open({type,index:i})))});if(!count)empty(c);return c}
function standingName(k){if(/^R\d+$/.test(k))return T('heat')+' '+k.substring(1);return {Position:T('pos'),Driver:T('driver'),BestLap:T('best'),BestThree:T('best3'),Score:T('score'),QualifyingPoints:T('points'),OverallResult:T('laps')+' / '+T('time'),Status:T('status')}[k]||k}
function standingValue(key,value){if(key!=='Status'||typeof value!=='string')return value;const eliminated=value.match(/^(?:Eliminato in|Eliminated in) Q([123])$/);if(eliminated)return (lang==='it'?'Eliminato in Q':'Eliminated in Q')+eliminated[1];if(value==='Classifica finale'||value==='Final standings')return lang==='it'?'Classifica finale':'Final standings';if(value==='In gara'||value==='Still competing')return lang==='it'?'In gara':'Still competing';return value}
function standingKeys(s){const keys=Object.keys(s.rows[0]),rounds=keys.filter(k=>/^R\d+$/.test(k)).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1))),special=keys.filter(k=>/^Q[123]$/.test(k)).sort(),score=s.mode==='Classifica a Punti'||s.mode==='Best Lap'?[]:['Score'];return ['Position','Driver',...rounds,...special,...score,'BestLap','QualifyingPoints','OverallResult','Status'].filter(k=>keys.includes(k))}

 if(view.type==='practice'){const c=card(T('summary'));if(!item.pilots.length)empty(c);else c.append(table([T('pos'),T('driver'),T('category'),T('laps'),T('best'),T('best3'),T('best5')],item.pilots.map((p,i)=>[p.position,button(p.name,()=>open({type:'practicePilot',index:view.index,pilot:i}),'link'),p.category,p.laps.length,time(p.best),time(p.best3),time(p.best5)])));out.append(c);return}
 if(view.type==='practicePilot'){const p=item.pilots[view.pilot],c=card(p.name+' · '+T('details'));c.append(el('p',p.category+' · '+T('best')+': '+time(p.best)+' · '+T('best3')+': '+time(p.best3)+' · '+T('best5')+': '+time(p.best5)));const groups=new Map();p.laps.forEach(l=>{const n=l.heat||1;if(!groups.has(n))groups.set(n,[]);groups.get(n).push(l)});if(!groups.size)empty(c);for(const [n,laps] of groups){c.append(el('h3',T('heat')+' '+n),table([T('lap'),T('time')],laps.map(l=>[l.number,time(l.seconds)])))}out.append(c);return}
 if(view.type==='race'){const c=card(T('standings'));if(!item.standings.length)empty(c);item.standings.forEach((s,i)=>c.append(button(T(s.phase)+' · '+s.category+(s.group!=null?' · '+groupName(s.phase,s.group):'')+' · '+T(s.consolidated?'consolidated':'provisional'),()=>open({type:'standing',index:view.index,standing:i}))));out.append(c);const h=card(T('rounds'));let count=0;item.heats.forEach((heat,hi)=>heat.rounds.forEach((round,ri)=>{count++;h.append(button(heatName(heat,round),()=>open({type:'round',index:view.index,heat:hi,round:ri})))}));if(!count)empty(h);out.append(h);return}
 if(view.type==='standing'){const s=item.standings[view.standing],c=card(T(s.phase)+' · '+s.category+(s.group!=null?' · '+groupName(s.phase,s.group):''));const badge=el('span',T(s.consolidated?'consolidated':'provisional'));badge.className='badge';c.append(badge);if(s.rows.length){const keys=standingKeys(s);c.append(table(keys.map(standingName),s.rows.map(r=>keys.map(k=>r[k]))),el('p',T('discarded')))}else empty(c);out.append(c);return}
 const heat=item.heats[view.heat],round=heat.rounds[view.round];
 if(view.type==='round'){const c=card(heatName(heat,round));c.append(el('p',date(round.started)));if(!round.results.length)empty(c);else c.append(table([T('pos'),T('number'),T('driver'),T('laps'),T('time'),T('best'),T('best3')],round.results.map((p,i)=>[p.position,p.number,button(p.name,()=>open({type:'racePilot',index:view.index,heat:view.heat,round:view.round,pilot:i}),'link'),p.laps,time(p.totalSeconds),time(p.best),time(p.best3)])));out.append(c);return}
 const p=round.results[view.pilot],c=card(p.name+' · '+T('details'));c.append(el('p',heatName(heat,round)+' · '+p.laps+' '+T('laps')+' · '+time(p.totalSeconds)+(p.corrected?' · '+T('correction'):'')));if(p.lapDetails.length)c.append(table([T('lap'),T('time')],p.lapDetails.map(l=>[l.number,time(l.seconds)+(l.corrected?' *':'')])),el('p',T('correctedLap')));else empty(c);out.append(c)
}
$('home').onclick=()=>{navStack=[];view={type:'home'};render()};$('back').onclick=()=>{if(navStack.length){view=navStack.pop();render();window.scrollTo(0,0)}};$('it').onclick=()=>{lang='it';render()};$('en').onclick=()=>{lang='en';render()};render();
</script></body></html>

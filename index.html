'use strict';const data=JSON.parse(document.getElementById('archive').textContent);let lang='it',view={type:'home'};const labels={it:{home:'Archivio',practice:'Pratica',races:'Gare',none:'Nessun risultato disponibile',track:'Pista',pilots:'Piloti',category:'Categoria',pos:'Pos',lap:'Giro',laps:'Giri',time:'Tempo',heat:'Heat',group:'Batteria',updated:'Aggiornato',details:'Dettaglio giri',standings:'Classifiche consolidate',rounds:'Risultati Heat',correction:'Risultato corretto',discarded:'* Heat scartata',noStandings:'Nessuna classifica consolidata pubblicata',FreePractice:'Prove Libere',Qualification:'Qualifiche',Final:'Finali'},en:{home:'Archive',practice:'Practice',races:'Races',none:'No results available',track:'Track',pilots:'Drivers',category:'Category',pos:'Pos',lap:'Lap',laps:'Laps',time:'Time',heat:'Heat',group:'Group',updated:'Updated',details:'Lap details',standings:'Consolidated standings',rounds:'Heat results',correction:'Corrected result',discarded:'* Discarded Heat',noStandings:'No consolidated standings published',FreePractice:'Free Practice',Qualification:'Qualifying',Final:'Finals'}};const $=id=>document.getElementById(id);function el(tag,value){let x=document.createElement(tag);if(value!==undefined)x.textContent=value;return x}function T(key){return labels[lang][key]||key}function date(v){const d=new Date(v);return Number.isNaN(d.valueOf())?v:d.toLocaleString(lang==='it'?'it-IT':'en-GB')}function time(v){if(!Number.isFinite(v)||v<0)return '—';let ms=Math.round(v*1000),m=Math.floor(ms/60000),s=((ms%60000)/1000).toFixed(3);return m?m+':'+s.padStart(6,'0'):s}function card(){let c=el('section');c.className='card';return c}function table(headers,rows){let wrap=el('div');wrap.className='table';let table=el('table'),head=el('thead'),tr=el('tr');for(let h of headers)tr.append(el('th',h));head.append(tr);table.append(head);let body=el('tbody');for(let row of rows){let line=el('tr');for(let value of row)line.append(el('td',String(value??'')));body.append(lin

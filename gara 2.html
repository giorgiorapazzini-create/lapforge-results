'use strict';const data=JSON.parse(document.getElementById('archive').textContent);let lang='it',view={type:'home'};const labels={it:{home:'Archivio',practice:'Pratica',races:'Gare',none:'Nessun risultato disponibile',track:'Pista',pilots:'Piloti',category:'Categoria',pos:'Pos',lap:'Giro',laps:'Giri',time:'Tempo',heat:'Heat',group:'Batteria',updated:'Aggiornato',details:'Dettaglio giri',standings:'Classifiche consolidate',rounds:'Risultati Heat',correction:'Risultato corretto',discarded:'* Heat scartata',noStandings:'Nessuna classifica consolidata pubblicata',FreePractice:'Prove Libere',Qualification:'Qualifiche',Final:'Finali'},en:{home:'Archive',practice:'Practice',races:'Races',none:'No results available',track:'Track',pilots:'Drivers',category:'Category',pos:'Pos',lap:'Lap',laps:'Laps',time:'Time',heat:'Heat',group:'Group',updated:'Updated',details:'Lap details',standings:'Consolidated standings',rounds:'Heat results',correction:'Corrected result',discarded:'* Discarded Heat',noStandings:'No consolidated standings published',FreePractice:'Free Practice',Qualification:'Qualifying',Final:'Finals'}};const $=id=>document.getElementById(id);function el(tag,value){let x=document.createElement(tag);if(value!==undefined)x.textContent=value;return x}function T(key){return labels[lang][key]||key}function date(v){const d=new Date(v);return Number.isNaN(d.valueOf())?v:d.toLocaleString(lang==='it'?'it-IT':'en-GB')}function time(v){if(!Number.isFinite(v)||v<0)return '—';let ms=Math.round(v*1000),m=Math.floor(ms/60000),s=((ms%60000)/1000).toFixed(3);return m?m+':'+s.padStart(6,'0'):s}function card(){let c=el('section');c.className='card';return c}function table(headers,rows){let wrap=el('div');wrap.className='table';let table=el('table'),head=el('thead'),tr=el('tr');for(let h of headers)tr.append(el('th',h));head.append(tr);table.append(head);let body=el('tbody');for(let row of rows){let line=el('tr');for(let value of row)line.append(el('td',String(value??'')));body.append(line)}table.append(body);wrap.append(table);return wrap}function button(label,fn){let b=el('button',label);b.className='item';b.onclick=fn;return b}function open(type,index){view={type,index};render()}function section(title,items,fn){let c=card();c.append(el('h2',title));if(!items.length)c.append(el('p',T('none')));items.forEach((item,i)=>c.append(button(`${item.name} · ${item.track} · ${date(item.date)}`,()=>fn(i))));return c}function render(){document.documentElement.lang=lang;$('updated').textContent=T('updated')+': '+date(data.generatedAt);$('home').textContent=T('home');let out=$('content');out.replaceChildren();if(view.type==='home'){out.append(section(T('practice'),data.practice,i=>open('practice',i)),section(T('races'),data.races,i=>open('race',i)));return}let item=view.type==='practice'?data.practice[view.index]:data.races[view.index];let top=card();top.append(el('h2',item.name),el('div',T('track')+': '+item.track+' · '+date(item.date)));out.append(top);if(view.type==='practice'){let c=card();c.append(el('h2',T('pilots')));for(let p of item.pilots){let d=el('details'),summary=el('summary',`${p.position}. ${p.name} · ${p.category} · ${p.laps.length} ${T('laps')}`);d.append(summary,table([T('heat'),T('lap'),T('time')],p.laps.map(l=>[l.heat||1,l.number,time(l.seconds)])));c.append(d)}out.append(c);return}let standings=card();standings.append(el('h2',T('standings')));if(!item.standings.length)standings.append(el('p',T('noStandings')));for(let s of item.standings){let d=el('details');d.append(el('summary',`${T(s.phase)} · ${s.category} · ${s.title}`));if(s.rows.length){let keys=Object.keys(s.rows[0]);let name=k=>({Position:T('pos'),Driver:T('pilots'),BestLap:T('time'),OverallResult:T('laps')+' / '+T('time'),Status:'Status'}[k]||k);d.append(table(keys.map(name),s.rows.map(r=>keys.map(k=>r[k]))),el('p',T('discarded')))}standings.append(d)}out.append(standings);let results=card();results.append(el('h2',T('rounds')));for(let heat of item.heats){for(let round of heat.rounds){let d=el('details');d.append(el('summary',`${T(heat.phase)} · ${heat.category} · ${T('group')} ${heat.group} · ${T('heat')} ${round.number}`));for(let p of round.results){let pilot=el('details');pilot.append(el('summary',`${p.position}. ${p.name} · ${p.laps} ${T('laps')} · ${time(p.totalSeconds)}${p.corrected?' · '+T('correction'):''}`),table([T('lap'),T('time')],p.lapDetails.map(l=>[l.number,time(l.seconds)+(l.corrected?' *':'')])));d.append(pilot)}results.append(d)}}out.append(results)}$('home').onclick=()=>{view={type:'home'};render()};$('it').onclick=()=>{lang='it';render()};$('en').onclick=()=>{lang='en';render()};render();
